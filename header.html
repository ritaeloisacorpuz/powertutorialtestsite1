<style>
  /* Header Base Styles */
  .site-header {
    background-color: #000000;
    width: 100%;
    position: relative;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 20px;
    min-height: 60px;
    position: relative;
  }

  /* Desktop Navigation */
  .main-nav {
    width: 100%;
  }

  .main-nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .main-nav ul li {
    margin: 0;
    padding: 8px 0;
  }

  .main-nav ul li a {
    color: #ffffff;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 400;
    letter-spacing: 0.5px;
    white-space: nowrap;
    transition: opacity 0.2s ease-in-out;
  }

  .main-nav ul li a:hover {
    opacity: 0.75;
  }

  /* Mobile Toggle Button */
  .mobile-menu-toggle {
    display: none;
    background: none;
    border: none;
    color: #ffffff;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 10px;
    width: 100%;
    text-align: right;
  }

  /* Mobile Responsive Adaptations */
  @media (max-width: 850px) {
    .header-inner {
      padding: 10px 20px;
    }

    .mobile-menu-toggle {
      display: block;
    }

    .main-nav {
      display: none;
      width: 100%;
      padding-bottom: 15px;
    }

    .main-nav.is-open {
      display: block;
    }

    .main-nav ul {
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .main-nav ul li a {
      font-size: 0.95rem;
      display: block;
      padding: 6px 0;
    }
  }
</style>

<header class="site-header">
  <div class="header-inner">
    <!-- Mobile Hamburger Button -->
    <button class="mobile-menu-toggle" id="mobileMenuBtn" aria-label="Toggle Navigation">
      &#9776; Menu
    </button>

    <!-- Navigation Menu -->
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="/index.html">Home</a></li>
        <li><a href="/about.html">About Power Tutorial</a></li>
        <li><a href="/services.html">Tutorial Services</a></li>
        <li><a href="/meet.html">Meet the Power Tutors</a></li>
        <li><a href="/publicdirectory.html">Public Directory</a></li>
        <li><a href="/booking.html">Booking a Tutorial</a></li>
        <li><a href="/payment.html">Payment Instructions</a></li>
        <li><a href="https://www.mybiblioteque.com/create-your-tutor-profile">Create your Tutor Profile</a></li>
        <li><a href="/campuschronicles.html">Blog</a></li>
      </ul>
    </nav>
  </div>
</header>

<script>
  // Simple toggle for mobile navigation menu
  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "mobileMenuBtn") {
      var nav = document.getElementById("mainNav");
      if (nav) {
        nav.classList.toggle("is-open");
      }
    }
  });
</script>
